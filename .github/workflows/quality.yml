name: CI

on:
  pull_request:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s tests/kapisch_validation
        working-directory: plugins/kapisch
      - run: python scripts/test_portable_package.py
        working-directory: plugins/kapisch
      - run: python scripts/validate_kapisch.py --help
        working-directory: plugins/kapisch
