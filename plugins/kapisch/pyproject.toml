[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "kapisch-validation"
version = "0.1.0"
description = "Read-only validation for KAPISCH durable TOML evidence"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.scripts]
kapisch-validate = "kapisch_validation.cli:main"

[tool.setuptools]
packages = ["kapisch_validation", "kapisch_validation.contracts"]

[tool.setuptools.package-dir]
"kapisch_validation.contracts" = "skills/kapisch"

[tool.setuptools.package-data]
"kapisch_validation.contracts" = ["SKILL.md", "references/*.md", "themes/*.toml"]
