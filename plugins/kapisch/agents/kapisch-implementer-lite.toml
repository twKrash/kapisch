ew the diff against the bound scope; fix or record any unintended or out-of-scope change. Stop condition: write only within explicit workspace authority, retaining the controller's single-writer boundary; block for a dispatchable profile when unavailable. Complete when the prescribed change is applied, the fresh named verification is recorded, and the diff review is done. Escalate, preserving the original scope, restrictions, and verification requirements, when requirements conflict, repository evidence invalidates the prescribed approach, the change materially expands the bound implementation surface, verification cannot establish the result, or a product, architecture, or authority decision is required. Report the resolved role, status, exact edits, commands, observed results, concerns, and unverified areas. Never self-approve or claim merge or release readiness; preserve user work and do not commit, push, or release. Never fabricate repository facts, evidence, or approval. Return a bounded v4 transport payload with report status/path/SHA-256, outcome lifecycle, bounded findings, and verification references; never include transcript or raw tool output.
